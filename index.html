<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NEXT WAVE - Radio & Music</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-bg"></div>

    <main class="content">
        <div class="logo-container">
            <svg class="headphones-svg" width="120" height="110" viewBox="0 0 120 110" fill="none">
                <defs>
                    <linearGradient id="hpGrad" x1="0" y1="0" x2="120" y2="0">
                        <stop offset="0%" stop-color="#22d3ee"/>
                        <stop offset="100%" stop-color="#a855f7"/>
                    </linearGradient>
                </defs>
                <path d="M15 62V50a45 45 0 0190 0v12" stroke="url(#hpGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
                <rect x="8" y="56" width="20" height="34" rx="9" stroke="url(#hpGrad)" stroke-width="8" fill="#05050c"/>
                <rect x="92" y="56" width="20" height="34" rx="9" stroke="url(#hpGrad)" stroke-width="8" fill="#05050c"/>
                <g stroke="url(#hpGrad)" stroke-width="4.5" stroke-linecap="round">
                    <line x1="42" y1="70" x2="42" y2="76"/>
                    <line x1="51" y1="64" x2="51" y2="82"/>
                    <line x1="60" y1="58" x2="60" y2="88"/>
                    <line x1="69" y1="64" x2="69" y2="82"/>
                    <line x1="78" y1="70" x2="78" y2="76"/>
                </g>
            </svg>
        </div>

        <h1 class="brand-title">NEXT WAVE</h1>
        <p class="tagline">Выбери волну — остальное сделает музыка</p>

        <div class="stations-container">
            <button class="station-btn" style="--delay:0" data-color="cyan" onclick="playPlaylist('game')">
                <span class="station-icon">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M7.2 7h9.6c2 0 3.6 1.8 3.9 3.9l.6 4.2a2.3 2.3 0 01-4.1 1.8L15.8 15H8.2l-1.4 1.9a2.3 2.3 0 01-4.1-1.8l.6-4.2C3.6 8.8 5.2 7 7.2 7z"/>
                        <rect x="7.3" y="10.2" width="1.4" height="3.6" rx="0.5" fill="#0a0e1a"/>
                        <rect x="6" y="11.5" width="3.6" height="1.4" rx="0.5" fill="#0a0e1a"/>
                        <circle cx="16" cy="10.8" r="1" fill="#0a0e1a"/>
                        <circle cx="18" cy="12.8" r="1" fill="#0a0e1a"/>
                    </svg>
                </span>
                <span class="station-name">Game On</span>
            </button>

            <button class="station-btn" style="--delay:1" data-color="purple" onclick="playPlaylist('chill')">
                <span class="station-icon">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M4 9h13v4.5A5.5 5.5 0 0111.5 19h-2A5.5 5.5 0 014 13.5V9z"/>
                        <path d="M17 10.2h1.3a2.3 2.3 0 010 4.6H17v-2h1.3a0.3 0.3 0 000-0.6H17v-2z"/>
                        <path d="M7 2.8c0 .9-1 .9-1 1.8s1 .9 1 1.8M11 2.8c0 .9-1 .9-1 1.8s1 .9 1 1.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>
                    </svg>
                </span>
                <span class="station-name">Chill Flow</span>
            </button>

            <button class="station-btn" style="--delay:2" data-color="cyan" onclick="playRadio('new')">
                <span class="station-icon">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M4 10c0-1.1.9-2 2-2h12a2 2 0 012 2v7a2 2 0 01-2 2H6a2 2 0 01-2-2v-7z"/>
                        <path d="M6 3l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                        <circle cx="8.5" cy="14.5" r="2.2" fill="#0a0e1a"/>
                        <rect x="13" y="12.3" width="6" height="1.4" rx="0.5" fill="#0a0e1a"/>
                        <rect x="13" y="15" width="6" height="1.4" rx="0.5" fill="#0a0e1a"/>
                    </svg>
                </span>
                <span class="station-name">Новое Радио</span>
            </button>

            <button class="station-btn" style="--delay:3" data-color="purple" onclick="playRadio('techno')">
                <span class="station-icon">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="9"/>
                        <circle cx="12" cy="12" r="3.2" fill="#0a0e1a"/>
                        <circle cx="12" cy="12" r="1.1"/>
                    </svg>
                </span>
                <span class="station-name">TechnoBase.FM</span>
            </button>
        </div>
    </main>

    <!-- Мини-плеер -->
    <div class="mini-player" id="miniPlayer">
        <div class="player-cover" id="playerCover"></div>
        <div class="player-info">
            <div class="track-name" id="trackName">—</div>
            <div class="track-status" id="trackStatus">Playing</div>
        </div>
        <div class="equalizer" id="equalizer">
            <span></span><span></span><span></span><span></span>
        </div>
        <button class="mute-btn" id="muteBtn" onclick="toggleMute()">
            <svg id="volIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M4 9v6h4l5 4V5L8 9H4z"/>
                <path d="M16.5 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            </svg>
            <svg id="muteIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                <path d="M4 9v6h4l5 4V5L8 9H4z"/>
                <path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            </svg>
        </button>
        <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlayPause()">
            <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="5" width="4" height="14" rx="1"/>
                <rect x="14" y="5" width="4" height="14" rx="1"/>
            </svg>
            <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                <path d="M7 5v14l12-7z"/>
            </svg>
        </button>
        <div class="player-progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <audio id="audio" crossorigin="anonymous"></audio>
    <script src="player.js"></script>
</body>
</html>
