<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NEXT WAVE - Radio & Music</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-bg"></div>
    <div class="sparkle">✦</div>

    <header class="top-bar">
        <button class="back-btn" onclick="history.back()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Назад
        </button>
    </header>

    <main class="content">
        <div class="logo-container">
            <div class="headphones-icon">
                <div class="headphone-left"></div>
                <div class="headphone-arc"></div>
                <div class="headphone-right"></div>
                <div class="soundwave">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <h1 class="brand-title">NEXT WAVE</h1>
        <p class="tagline">Выбери волну — остальное сделает музыка</p>

        <div class="stations-container">
            <button class="station-btn" data-color="cyan" onclick="playRadio('new')">
                <span class="station-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                        <path d="M18 8L6 3M18 8H6M18 8v11a1 1 0 01-1 1H7a1 1 0 01-1-1V8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="8" cy="14" r="1.3" fill="currentColor"/>
                        <path d="M13 12h4M13 15h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="station-name">Новое Радио</span>
            </button>

            <button class="station-btn" data-color="purple" onclick="playRadio('techno')">
                <span class="station-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                        <circle cx="12" cy="12" r="0.8" fill="currentColor"/>
                    </svg>
                </span>
                <span class="station-name">TechnoBase.FM</span>
            </button>
        </div>
    </main>

    <!-- Мини-плеер -->
    <div class="mini-player" id="miniPlayer">
        <div class="player-cover" id="playerCover">
            <span class="cover-icon" id="coverIcon"></span>
        </div>
        <div class="player-info">
            <div class="track-name" id="trackName">—</div>
            <div class="track-status" id="trackStatus">Playing</div>
        </div>
        <div class="equalizer" id="equalizer">
            <span></span><span></span><span></span><span></span>
        </div>
        <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlayPause()">
            <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/>
                <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>
            </svg>
            <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" style="display:none">
                <path d="M7 5v14l12-7z" fill="currentColor"/>
            </svg>
        </button>
        <div class="player-progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <audio id="audio" crossorigin="anonymous"></audio>
    <script src="player.js"></script>
</body>
</html>
