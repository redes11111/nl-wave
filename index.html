<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NEXT WAVE - Radio & Music</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-bg"></div>
    <div class="sparkle">✦</div>

    <header class="top-bar">
        <button class="back-btn" onclick="history.back()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Назад
        </button>
    </header>

    <main class="content">
        <div class="logo-container">
            <div class="headphones-icon">
                <div class="headphone-left"></div>
                <div class="headphone-arc"></div>
                <div class="headphone-right"></div>
                <div class="soundwave">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <h1 class="brand-title">NEXT WAVE</h1>
        <p class="tagline">Выбери волну — остальное сделает музыка</p>

        <div class="stations-container">
            <button class="station-btn" style="--delay:0" data-color="cyan" onclick="playRadio('game')">
                <span class="station-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                        <path d="M7.5 8h9a4 4 0 013.95 4.6l-.6 3.4a2.5 2.5 0 01-4.5 1.1L14 15.5h-4l-1.35 1.6a2.5 2.5 0 01-4.5-1.1l-.6-3.4A4 4 0 017.5 8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        <path d="M8 11v2M7 12h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        <circle cx="16" cy="11" r="0.9" fill="currentColor"/>
                        <circle cx="17.5" cy="13" r="0.9" fill="currentColor"/>
                    </svg>
                </span>
                <span class="station-name">GAME ON</span>
            </button>

            <button class="station-btn" style="--delay:1" data-color="purple" onclick="playRadio('chill')">
                <span class="station-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                        <path d="M4 9h13v4a5 5 0 01-5 5H9a5 5 0 01-5-5V9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        <path d="M17 10h1.5a2 2 0 010 4H17" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M7 3.5c0 1-1 1-1 2s1 1 1 2M11 3.5c0 1-1 1-1 2s1 1 1 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="station-name">CHILL FLOW</span>
            </button>

            <button class="station-btn" style="--delay:2" data-color="cyan" onclick="playRadio('new')">
                <span class="station-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                        <path d="M18 8L6 3M18 8H6M18 8v11a1 1 0 01-1 1H7a1 1 0 01-1-1V8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="8" cy="14" r="1.3" fill="currentColor"/>
                        <path d="M13 12h4M13 15h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="station-name">Новое Радио</span>
            </button>

            <button class="station-btn" style="--delay:3" data-color="purple" onclick="playRadio('techno')">
                <span class="station-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                        <circle cx="12" cy="12" r="0.8" fill="currentColor"/>
                    </svg>
                </span>
                <span class="station-name">TechnoBase.FM</span>
            </button>
        </div>
    </main>

    <!-- Мини-плеер -->
    <div class="mini-player" id="miniPlayer">
        <div class="player-cover" id="playerCover"></div>
        <div class="player-info">
            <div class="track-name" id="trackName">—</div>
            <div class="track-status" id="trackStatus">Playing</div>
        </div>
        <div class="equalizer" id="equalizer">
            <span></span><span></span><span></span><span></span>
        </div>
        <button class="mute-btn" id="muteBtn" onclick="toggleMute()">
            <svg id="volIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
                <path d="M16.5 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <svg id="muteIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none">
                <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
                <path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
        </button>
        <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlayPause()">
            <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/>
                <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>
            </svg>
            <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" style="display:none">
                <path d="M7 5v14l12-7z" fill="currentColor"/>
            </svg>
        </button>
        <div class="player-progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <audio id="audio" crossorigin="anonymous"></audio>
    <script src="player.js"></script>
</body>
</html>
